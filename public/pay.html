<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none';">
<title>Faranux — Pay</title>
<style>
  :root {
    --faranux-maroon: #9E2A2B;
    --faranux-dark: #540B0E;
    --faranux-accent: #E09F3E;
    --bg-main: #F8FAFC;
    --paper: #FFFFFF;
    --ink: #1E293B;
    --ink-soft: #64748B;
    --rule: #E2E8F0;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg-main); font-family: var(--sans); color: var(--ink);
  }
  .wrap {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--paper);
    border-radius: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .card-header {
    background: var(--faranux-dark);
    background-image: linear-gradient(135deg, var(--faranux-dark) 0%, var(--faranux-maroon) 100%);
    color: #fff; padding: 28px 24px; text-align: center;
  }
  .card-header .brand {
    font-family: var(--mono); font-size: 24px; font-weight: 700;
    letter-spacing: 0.15em; margin-bottom: 4px;
  }
  .card-header .sub {
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }
  .card-body { padding: 28px 24px; text-align: center; }
  .amount-label {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--ink-soft); margin-bottom: 6px;
  }
  .amount {
    font-family: var(--mono); font-size: 40px; font-weight: 700;
    color: var(--faranux-maroon); font-variant-numeric: tabular-nums;
    margin-bottom: 24px;
  }
  .pay-btn {
    display: block; width: 100%; border: none; cursor: pointer;
    background: var(--faranux-maroon); color: #fff;
    font-family: var(--sans); font-size: 17px; font-weight: 700;
    padding: 16px; border-radius: 12px;
    box-shadow: 0 6px 16px rgba(158,42,43,0.3);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .pay-btn:active { transform: scale(0.97); box-shadow: 0 3px 8px rgba(158,42,43,0.3); }
  .hint {
    margin-top: 16px; font-size: 13px; color: var(--ink-soft); line-height: 1.5;
  }
  .manual {
    margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--rule);
  }
  .manual-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
  .manual-code-row {
    display: flex; gap: 8px; align-items: center; justify-content: center;
  }
  .manual-code {
    font-family: var(--mono); font-size: 18px; font-weight: 700;
    color: var(--ink); letter-spacing: 0.02em; word-break: break-all;
    background: var(--bg-main); border: 1px solid var(--rule);
    border-radius: 8px; padding: 10px 12px; flex: 1; text-align: left;
  }
  .cp-btn {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-main); border: 1px solid var(--rule);
    border-radius: 8px; padding: 12px; cursor: pointer; color: var(--ink-soft);
    transition: all .2s;
  }
  .cp-btn:hover { background: var(--rule); color: var(--ink); }
  .cp-btn:active { transform: scale(0.95); }
  .error .card-header { background: var(--ink-soft); background-image: none; }
  .error .card-body h2 { color: var(--faranux-maroon); font-size: 20px; margin: 0 0 12px; }
  .error .card-body p { color: var(--ink-soft); font-size: 15px; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script>
(function(){
  const wrap = document.getElementById('wrap');
  const params = new URLSearchParams(location.search);

  function renderError(message){
    wrap.innerHTML = `
      <div class="card error">
        <div class="card-header">
          <div class="brand">FARANUX</div>
        </div>
        <div class="card-body">
          <h2>Can't Start Payment</h2>
          <p>${message}<br><br>Please ask your cashier for help.</p>
        </div>
      </div>`;
  }

  // ---- Validate merchant code: digits only, 4-12 chars ----
  const rawCode = params.get('c') || '';
  if (!/^[0-9]{4,12}$/.test(rawCode)) {
    renderError('The payment link is missing a valid merchant code.');
    return;
  }

  // ---- Validate amount: positive number, sane upper bound ----
  const rawAmount = params.get('a') || '';
  const amount = Number(rawAmount);
  if (!Number.isFinite(amount) || amount <= 0 || amount > 50000000) {
    renderError('The payment link is missing a valid amount.');
    return;
  }
  // MoMo USSD amounts are whole numbers
  const amountInt = Math.round(amount);

  const currency = (params.get('cur') || 'RWF').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 3) || 'RWF';

  function money(n, cur){
    try { return new Intl.NumberFormat(undefined, {style:'currency', currency: cur}).format(n); }
    catch(e){ return cur + ' ' + n; }
  }

  const ussd = `tel:*182*8*1*${rawCode}*${amountInt}#`;

  wrap.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="brand">FARANUX</div>
        <div class="sub">Mobile Money Payment</div>
      </div>
      <div class="card-body">
        <div class="amount-label">Amount to Pay</div>
        <div class="amount">${money(amountInt, currency)}</div>
        <button class="pay-btn" id="payBtn">Tap to Pay via Mobile Money</button>
        <div class="hint">This opens your phone dialer with the payment code already filled in. Just confirm and enter your PIN.</div>
        <div class="manual">
          <div class="manual-label">Or dial this manually:</div>
          <div class="manual-code-row">
            <div class="manual-code">*182*8*1*${rawCode}*${amountInt}#</div>
            <button class="cp-btn" id="cpBtn" title="Copy code">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18">
                <path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>`;

  const payBtn = document.getElementById('payBtn');
  payBtn.addEventListener('click', function(){
    window.location.href = ussd;
  });

  const cpBtn = document.getElementById('cpBtn');
  if (cpBtn) {
    cpBtn.addEventListener('click', function(){
      navigator.clipboard.writeText('*182*8*1*' + rawCode + '*' + amountInt + '#').then(() => {
        const originalHtml = cpBtn.innerHTML;
        cpBtn.innerHTML = '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>';
        cpBtn.style.color = '#065F46'; // success color
        setTimeout(() => {
          cpBtn.innerHTML = originalHtml;
          cpBtn.style.color = '';
        }, 1500);
      });
    });
  }

  // Best-effort auto-attempt for platforms that allow it (mainly Android).
  // iOS Safari requires a genuine user gesture, so the button above is the
  // reliable path there — this is just a convenience for browsers that permit it.
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  if (!isIOS) {
    setTimeout(function(){ window.location.href = ussd; }, 300);
  }
})();
</script>
</body>
</html>
