name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          # DELETE THIS LINE: echo "GH_TOKEN=${{ secrets.GH_TOKEN }}" >> .env
          echo "API_URL=${{ secrets.API_URL }}" >> .env
          echo "DEBUG=false" >> .env
          echo "LOG_LEVEL=info" >> .env
        shell: bash

      - name: Verify .env file
        run: |
          echo "Checking .env file..."
          if [ -f .env ]; then
            echo ".env file created successfully"
            wc -l .env
          else
            echo "ERROR: .env file not created!"
            exit 1
          fi
        shell: bash

      - name: Build and publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npm run publish

      # Bridge release: existing installations still check inventory-desktop-app.
      # Keep this step and the old repo public until all deployed apps receive this update.
      - name: Publish transition release to existing update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="faranux-electronics/inventory-desktop-app"
          assets=(dist/*.exe dist/latest.yml dist/*.blockmap)
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$repo" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$repo" --title "Faranux ERP $tag" --notes "Transition release. Future updates are served from faranux-erp-app."
          fi

      - name: Verify release artifacts
        run: |
          echo "Checking for release files..."
          dir dist
        shell: bash

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          retention-days: 30